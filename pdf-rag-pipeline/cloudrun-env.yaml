# Non-secret env vars for Cloud Run (gcloud --env-vars-file).
# See ../cloudbuild.yaml --set-secrets for pdf-rag-pipeline (MONGO_URI, DATABASE_URL for postgres, JWT, LLM keys).
# To enable Sentry: set SENTRY_ENABLED true, create secret pdf-rag-pipeline-sentry-dsn,
# then add SENTRY_DSN to --set-secrets or use Cloud Run UI.
#
# --- persistence (mongo default | postgres / Supabase) ---
# APP_PERSISTENCE_PROVIDER: mongo — uses MONGO_URI secret + MONGO_DB below.
# APP_PERSISTENCE_PROVIDER: postgres — uses DATABASE_URL secret (postgresql://...); MONGO_URI not required.
# Optional tuning when provider=postgres (full-text rank threshold; differs from Mongo textScore scale):
# PG_TEXT_SEARCH_MIN_SCORE: "0.02"

APP_PERSISTENCE_PROVIDER: postgres
MONGO_DB: rag_db
JWT_ALGORITHM: HS256
JWT_ISSUER: flexshell-hospital
JWT_AUDIENCE: web
LLM_PROVIDER: openai
LLM_MODEL: gpt-4o-mini
TEXT_SEARCH_MIN_SCORE: "0.7"
MAX_CHUNKS: "3"
MAX_CONTEXT_TOKENS: "1200"
MIN_CHUNKS_REQUIRED: "1"
CACHE_TTL_HOURS: "12"
PDF_DIR: "./pdfs"
APP_LOG_LEVEL: INFO
RAG_LOG_FULL_PROMPT: "true"
RAG_LOG_PROMPT_PREVIEW_CHARS: "400"
DOMAIN_POINTS_FILE: config/domain_points.json
# RAG chunk images (Supabase S3 — same project/keys as backend-hospital; bucket name differs)
SUPABASE_URL: https://xbefsiwpieeznbkbahab.supabase.co
SUPABASE_S3_ENDPOINT: https://xbefsiwpieeznbkbahab.storage.supabase.co/storage/v1/s3
SUPABASE_S3_REGION: auto
STORAGE_BUCKET: chunk-images
# SUPABASE_S3_ACCESS_KEY + SUPABASE_S3_SECRET_KEY: cloudbuild --set-secrets (backend-hospital-supabase-s3-*)
CORS_ORIGINS: "https://agastyahealthcare.com,https://www.agastyahealthcare.com,https://backend-hospital-yspwmymsgq-el.a.run.app,https://oshu-ai-clinic-ui.onrender.com,http://localhost:5173"
SENTRY_TRACES_SAMPLE_RATE: "1.0"
SENTRY_ENABLED: "true"
SENTRY_DSN: "https://13c8f9a52f54d607d42214e4e936f653@o4511297937539072.ingest.us.sentry.io/4511297943306240"
SENTRY_ENVIRONMENT: "production"

RAG_ENABLE_HYDE: "true"
RAG_HYDE_VARIANT_COUNT: "3"
RAG_HYDE_RRF_TOP_K: "8"
RAG_HYDE_INCLUDE_ORIGINAL_QUERY: "true"
RAG_HYDE_SEARCH_TOP_K: "10"
