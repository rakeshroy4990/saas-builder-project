# Build and deploy only `backend-hospital` to Cloud Run.
# Uses:
#   - `backend-hospital/cloudrun-env.yaml` (committed, non-secret env vars)
#   - Secret Manager via `--set-secrets` (no secret values in this file)
#
# Manual submit (SHORT_SHA is empty unless you pass it):
#   gcloud builds submit --config=cloudbuild-backend-hospital.yaml .
# Or with git tag:
#   gcloud builds submit --config=cloudbuild-backend-hospital.yaml --substitutions=SHORT_SHA=$(git rev-parse --short HEAD) .
#
# AI keys (same names as backend-hospital/.env APP_AI_*):
#   printf %s 'sk-...' | gcloud secrets create backend-hospital-app-ai-openai-api-key --data-file=-
#   printf %s 'AIza...' | gcloud secrets create backend-hospital-app-ai-gemini-api-key --data-file=-
# Prescription S3 credentials:
#   printf %s 'your-s3-access-key' | gcloud secrets create backend-hospital-supabase-s3-access-key --data-file=-
#   printf %s 'your-s3-secret-key' | gcloud secrets create backend-hospital-supabase-s3-secret-key --data-file=-

steps:
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -eo pipefail
        IMAGE=asia-south1-docker.pkg.dev/oshucare/oshucare/backend-hospital
        # $SHORT_SHA / $BUILD_ID are expanded by Cloud Build before bash runs (not shell env vars).
        TAG="${SHORT_SHA}"
        if [ -z "$$TAG" ]; then
          TAG="${BUILD_ID}"
          TAG="$${TAG:0:12}"
          echo "SHORT_SHA unset; using BUILD_ID tag: $$TAG"
        fi
        echo "$$TAG" > /workspace/image_tag.txt
        export DOCKER_BUILDKIT=1
        docker build \
          -t "$$IMAGE:$$TAG" \
          -t "$$IMAGE:latest" \
          -f backend-hospital/Dockerfile \
          .

  - id: push-backend
    name: gcr.io/cloud-builders/docker
    waitFor: [build-backend]
    args:
      - push
      - --all-tags
      - asia-south1-docker.pkg.dev/oshucare/oshucare/backend-hospital

  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [push-backend]
    entrypoint: bash
    args:
      - -c
      - |
        set -eo pipefail
        TAG="$(cat /workspace/image_tag.txt)"
        gcloud run deploy backend-hospital \
          --image "asia-south1-docker.pkg.dev/oshucare/oshucare/backend-hospital:$$TAG" \
          --region asia-south1 \
          --platform managed \
          --allow-unauthenticated \
          --env-vars-file backend-hospital/cloudrun-env.yaml \
          --set-secrets "SPRING_DATA_MONGODB_URI=backend-hospital-spring-data-mongodb-uri:latest,APP_AUTH_JWT_SECRET=backend-hospital-app-auth-jwt-secret:latest,APP_VIDEO_AGORA_APP_CERTIFICATE=backend-hospital-app-video-agora-certificate:latest,CLOUDINARY_URL=backend-hospital-cloudinary-url:latest,APP_AI_OPENAI_API_KEY=backend-hospital-app-ai-openai-api-key:latest,APP_AI_GEMINI_API_KEY=backend-hospital-app-ai-gemini-api-key:latest,SUPABASE_S3_ACCESS_KEY=backend-hospital-supabase-s3-access-key:latest,SUPABASE_S3_SECRET_KEY=backend-hospital-supabase-s3-secret-key:latest" \
          --quiet

images:
  - asia-south1-docker.pkg.dev/oshucare/oshucare/backend-hospital

options:
  logging: CLOUD_LOGGING_ONLY
  env:
    - 'DOCKER_BUILDKIT=1'
